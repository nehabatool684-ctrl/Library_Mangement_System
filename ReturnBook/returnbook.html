<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borrowbook</title>
    <style>
       button{
    margin-top: 10px;
    border-radius: 20px;
    background-color: maroon;
    color: white;
    padding: 20px;

}
.main{
    width: 100%;
    height: 100%;
    background-image: url('./libimage2.jpg');
     background-size: cover;
    background-repeat: no-repeat;
    BACKGROUND-ATTACHMENT: fixed;
    background-position: center;
    min-height: 100vh;
    width: 100%;
    opacity: 0.9;
   
    display: flex;
    justify-content: center;
}
input{
    padding: 10px;
    border-radius: 20px;
}

h3{
    text-align: center;
    color: white;
    background-color: maroon;
}
.sub-div{
    padding: 10px;
    margin-top: 10px;
    background-color: brown;
    border: 5px white solid;
    color: white;
    height:350px;
    width: 400px;
}
a{
  text-decoration: none;
  color: white;
}

    </style>
</head>
<body>
    <div class="main">
    <div class="sub-div">
        <h3>Return Book</h3>
          <form action="http://localhost/cgi-bin/returnbook.exe" method="post">
          <p>Book ID: <input type="text" name="bookid" required></p>
          <p>Due Date: <input type="date" name="duedate" required></p>
          <p>Return Date: <input type="date" name="returndate">
            <small>(leave empty to use today's date)</small></p>
            <p><input type="submit" value="Return Book"></p>
  </form>
    <a href="./gui.html">Back to Main Page</a>
    </div>
    </div>
</body>
</html>
