<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Add Book</title>
     <style>
       button{
    margin-top: 10px;
    border-radius: 20px;
    background-color: maroon;
    color: white;
    padding: 20px;

}
.main{
    width: 100%;
    height: 100%;
    background-image: url('./libimage2.jpg');
     background-size: cover;
    background-repeat: no-repeat;
    BACKGROUND-ATTACHMENT: fixed;
    background-position: center;
    min-height: 100vh;
    width: 100%;
    opacity: 0.9;
   
    display: flex;
    justify-content: center;
}
input{
    padding: 10px;
    border-radius: 20px;
}

h2{
    text-align: center;
    color: white;
    background-color: maroon;
}
.sub-div{
    padding: 10px;
    margin-top: 10px;
    background-color: brown;
    border: 5px white solid;
    color: white;
    height:300px;
    width: 400px;
}
a{
  text-decoration: none;
  color: white;
}

    </style>
</head>
<body>
  <div class="main">
    <div class="sub-div">
  <h2>Add a Book</h2>
  <form action="http://localhost/cgi-bin/add.exe" method="post">
    <p>Book Name: <input type="text" name="bookname" required></p>
    <p>Book ID: <input type="text" name="bookid" required></p>
    <p>Author: <input type="text" name="author" required></p>
    <p><input type="submit" value="Add Book"></p>
  </form>
    <a href="./gui.html">Back to Main Page</a>
  </div>
</div>
</body>
</html>
